name: Ελαφρύ intraday rescan τιμών

on:
  schedule:
    # Κάθε 2 ώρες, 06:00–20:00 UTC (09:00–23:00 Ελλάδα), Δευ-Παρ — καλύπτει τις
    # ώρες που κοιτάει κανείς το dashboard. Ανανεώνει μόνο τιμή/RSI/MA/scores
    # (1 request/μετοχή) — όχι sector/ROE-5y, που τα φέρνει το πλήρες βραδινό
    # scan (update.yml, 21:30 UTC).
    - cron: '0 6-20/2 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  prices-rescan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scanner/requirements.txt

      - name: Ελαφρύ rescan τιμών
        env:
          SCAN_SLEEP: '0.6'
        run: python scanner/scan.py --prices-only

      - name: Commit & push αν άλλαξε κάτι
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "Καμία αλλαγή στο data.json."
          else
            git commit -m "Ελαφρύ rescan τιμών $(date -u +%Y-%m-%dT%H:%M)"
            git push
          fi
