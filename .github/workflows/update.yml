name: Ενημέρωση δεδομένων μετοχών

on:
  schedule:
    # 21:30 UTC, Δευ-Παρ (~λίγο μετά το κλείσιμο NYSE/NASDAQ)
    - cron: '30 21 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scanner/requirements.txt

      - name: Run scanner
        env:
          T212_API_KEY: ${{ secrets.T212_API_KEY }}
          T212_API_SECRET: ${{ secrets.T212_API_SECRET }}
          T212_MODE: ${{ secrets.T212_MODE || 'demo' }}
          # 9 αγορές, ~1100+ tickers (V6) — 0.6s αντί για το default 1.2s ώστε το nightly
          # run να μη διαρκεί ώρες· δοκιμασμένο αξιόπιστο σε τοπικά runs στο 0.5s.
          SCAN_SLEEP: '0.6'
        run: python scanner/scan.py

      - name: Commit & push αν άλλαξε κάτι
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json news.json
          [ -f positions.json ] && git add positions.json
          [ -f picks_history.json ] && git add picks_history.json
          if git diff --staged --quiet; then
            echo "Καμία αλλαγή σε data.json/news.json/positions.json."
            exit 0
          fi
          git commit -m "Auto-update stock data $(date -u +%Y-%m-%d)"
          # Retry με rebase σε περίπτωση race condition με άλλο workflow (π.χ. το
          # ελαφρύ intraday rescan) που έκανε push στο μεταξύ — τα data.json κ.λπ.
          # είναι μονογραμμικά JSON, οπότε σε σύγκρουση κρατάμε το δικό μας
          # (πιο πρόσφατο/πλήρες recompute) πάνω από το φρέσκο origin/main.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Έγινε push."
              exit 0
            fi
            echo "Push απορρίφθηκε (προσπάθεια $i) — συγχρονισμός με origin/main..."
            git fetch origin main
            git reset --soft origin/main
            git add data.json news.json
            [ -f positions.json ] && git add positions.json
            [ -f picks_history.json ] && git add picks_history.json
            git commit -m "Auto-update stock data $(date -u +%Y-%m-%d)"
            sleep $((RANDOM % 10 + 5))
          done
          echo "Απέτυχε το push μετά από επαναλήψεις." >&2
          exit 1
